services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://rasavidya:rasavidya@db:5432/rasavidya
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rasavidya
      POSTGRES_PASSWORD: rasavidya
      POSTGRES_DB: rasavidya
    ports:
      - "5432:5432"
    volumes:
      - rasavidya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rasavidya -d rasavidya"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rasavidya_pgdata:
